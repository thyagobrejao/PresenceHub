services:
  # =============================================================================
  # PresenceHub Backend
  # =============================================================================
  presencehub:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: presencehub-backend
    restart: unless-stopped
    network_mode: host
    env_file:
      - .env
    volumes:
      - presencehub_data:/app/data
      - ./config/config.yaml:/app/config/config.yaml:ro

  # =============================================================================
  # PresenceHub Frontend (Vue 3 SPA)
  # =============================================================================
  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: presencehub-frontend
    restart: unless-stopped
    network_mode: host

volumes:
  presencehub_data:
